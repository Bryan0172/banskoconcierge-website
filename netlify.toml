# ── Interne Dateien aus dem oeffentlich ausgelieferten Wurzelbaum sperren ──────
# 21.09.2026, SEO/GEO auf REQ-2026-09-21-DAS-MOBILE-CONTEXT-LECK-WAR-NICHT-DER-EINZELFALL.
# Ursache: publish = "." liefert den kompletten Repo-Wurzelbaum aus. Die Dateien
# MUESSEN im Repo bleiben (Cloud-Session sieht nur Git) — deshalb wird gesperrt,
# nicht geloescht. 0 Loeschung, 0 Textaenderung, 0 Preis.
#
# ‼️ force = true ist hier NICHT optional: Netlify wertet Redirects sonst NACH dem
# statischen Datei-Match aus — die existierende Datei gewinnt, die Regel laeuft ins
# Leere und "Regel steht drin" meldet Vollzug, waehrend die Datei weiter ausgeliefert
# wird. Nach dem Deploy an der LIVE-URL gegenmessen, nicht an dieser Datei.
#
# Geprueft vor dem Eintrag (21.09. 15:5x BG, live + repo-weit):
#   · /.netlify/functions/* (MIT Punkt) ist der echte Endpunktraum → GET = 405, unberuehrt.
#     /netlify/functions/* (OHNE Punkt) ist nur das Quellverzeichnis. Das Formular sendet
#     an .netlify/functions/lead — die Regel unten trifft es nicht.
#   · seo-keywords.json hat repo-weit NULL Consumer (weder Client noch Function).
#   · posts.json ist bewusst NICHT gesperrt — blog.html laedt sie clientseitig.

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESKTOP-SYNC-INSTRUCTIONS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/seo-keywords.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/functions/*"
  to = "/404.html"
  status = 404
  force = true
