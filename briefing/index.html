<!DOCTYPE html>
<html lang="bg" id="html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briefing | Bansko Concierge</title>
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#0A0E27" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="https://banskoconcierge.com/briefing/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap&subset=latin,cyrillic" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#0A0E27;--navy-mid:#141830;--navy-lt:#1E2340;--gold:#C9A96E;--gold-lt:#E8D5B0;--white:#F8F6F0;--grey:#9A9A9A}
    body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--white);line-height:1.6;min-height:100vh}
    a{color:var(--gold-lt)}
    .wrap{max-width:640px;margin:0 auto;padding:28px 20px 56px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px;gap:12px}
    .brand{font-family:'Playfair Display',serif;font-size:1.15rem;letter-spacing:.04em}
    .lang{display:flex;gap:6px}
    .lang button{background:none;border:1px solid var(--navy-lt);color:var(--grey);padding:6px 11px;font:500 12px 'Inter',sans-serif;letter-spacing:.1em;cursor:pointer;border-radius:3px}
    .lang button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
    .label{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:14px}
    h1{font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.2;margin-bottom:18px}
    .lead{color:#d6d2c6;font-size:1.02rem;margin-bottom:28px}
    ul.topics{list-style:none;border-top:1px solid var(--navy-lt);margin-bottom:34px}
    ul.topics li{padding:13px 0;border-bottom:1px solid var(--navy-lt);display:flex;gap:14px;align-items:baseline}
    ul.topics b{color:var(--gold);font-weight:500;font-size:12px;letter-spacing:.14em;min-width:22px}
    form{background:var(--navy-mid);padding:26px 22px;border-top:2px solid var(--gold)}
    label.f,.fl{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin:0 0 6px}
    input[type=email]{width:100%;padding:13px 14px;background:var(--navy);border:1px solid var(--navy-lt);color:var(--white);font:16px 'Inter',sans-serif;border-radius:3px;margin-bottom:18px}
    input[type=email]:focus{outline:2px solid var(--gold);outline-offset:1px}
    .issue{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap}
    .issue label{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
    .consent{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:#cfcabb;margin-bottom:18px}
    .consent input{margin-top:4px;accent-color:var(--gold);width:18px;height:18px;flex:none}
    button.go{width:100%;padding:15px;background:var(--gold);color:var(--navy);border:0;font:600 14px 'Inter',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:3px}
    button.go[disabled]{opacity:.6;cursor:wait}
    .hp{position:absolute;left:-9999px;height:0;overflow:hidden}
    .msg{margin-top:16px;font-size:.95rem;padding:12px 14px;border-radius:3px;display:none}
    .msg.ok{display:block;background:#16301f;color:#cfe8d5}
    .msg.err{display:block;background:#3a1a1a;color:#f1cfcf}
    .note{color:var(--grey);font-size:.82rem;margin-top:22px}
    footer{margin-top:40px;font-size:.78rem;color:var(--grey);border-top:1px solid var(--navy-lt);padding-top:18px}
    .confirmed{display:none;background:var(--navy-mid);padding:26px 22px;border-top:2px solid var(--gold)}
    .confirmed h2{font-family:'Playfair Display',serif;font-weight:400;font-size:1.5rem;margin-bottom:8px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Bansko Concierge</div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-l="bg" aria-pressed="true">BG</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
      <button type="button" data-l="de" aria-pressed="false">DE</button>
    </div>
  </div>

  <div id="confirmed" class="confirmed" role="status">
    <h2 data-k="okTitle"></h2><p data-k="okText"></p>
  </div>

  <div id="confirmPanel" class="confirmed" role="region">
    <h2 data-k="cTitle"></h2><p data-k="cText" style="margin-bottom:18px"></p>
    <button class="go" id="cGo" type="button" data-k="cBtn"></button>
    <div id="cMsg" class="msg" role="status" aria-live="polite"></div>
  </div>

  <main id="main">
    <span class="label" data-k="label"></span>
    <h1 data-k="title"></h1>
    <p class="lead" data-k="lead"></p>
    <ul class="topics">
      <li><b>01</b><span data-k="t1"></span></li>
      <li><b>02</b><span data-k="t2"></span></li>
      <li><b>03</b><span data-k="t3"></span></li>
    </ul>

    <form id="f" novalidate>
      <label class="f" for="email" data-k="emailLabel"></label>
      <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required />
      <div class="issue"><span class="fl" style="width:100%" data-k="issueLabel"></span>
        <label><input type="radio" name="issue" value="de" /> Deutsch</label>
        <label><input type="radio" name="issue" value="en" checked /> English</label>
      </div>
      <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off" /></label></div>
      <label class="consent"><input type="checkbox" id="consent" required /><span data-k="consent"></span></label>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADtt3czGBcYEI0zB" data-theme="dark" style="margin-bottom:14px"></div>
      <button class="go" id="go" type="submit" data-k="submit"></button>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </form>
    <p class="note" data-k="note"></p>
  </main>

  <footer>Bansko Concierge &middot; PEAK CARE EDPK, ul. Stragite 8, Bansko, Bulgaria &middot; <a href="/privacy.html" data-k="privacy"></a></footer>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
var T = {
  bg: {
    label:'Брифинг за имоти и инвестиции',
    title:'Брифинг за имоти и инвестиции в България',
    lead:'Кратък, подбран преглед за купувачи, инвеститори и клиенти. Абонирайте се със своя имейл и потвърдете абонамента с един клик.',
    t1:'Пазарна картина', t2:'Право и данъци', t3:'Избрани имоти, цена при запитване',
    emailLabel:'Вашият имейл', issueLabel:'Брифингът излиза на:',
    consent:'Съгласен/съгласна съм Bansko Concierge (PEAK CARE EDPK) да обработва имейл адреса ми, за да ми изпраща брифинга. Изпращането е чрез Brevo (Франция). Мога да оттегля съгласието си по всяко време чрез връзката във всеки имейл.',
    submit:'Абонирай се',
    note:'След изпращане ще получите имейл за потвърждение. Без потвърждение абонамент не се създава.',
    sending:'Изпращане…',
    ok:'Почти готово: изпратихме Ви имейл за потвърждение. Моля, проверете и папката със спам.',
    eEmail:'Моля, въведете валиден имейл адрес.', eConsent:'Моля, потвърдете съгласието.', eCaptcha:'Моля, потвърдете проверката за сигурност.', eSend:'Изпращането не успя. Моля, опитайте отново или пишете на hello@banskoconcierge.com.',
    cTitle:'Потвърдете абонамента си', cText:'Натиснете бутона, за да завършите абонирането за Bansko Concierge Briefing.', cBtn:'Потвърждавам', cErr:'Връзката е невалидна или е изтекла. Моля, абонирайте се отново.',
    okTitle:'Абонаментът е потвърден', okText:'Благодарим Ви. Следващият брифинг ще получите на посочения имейл.', privacy:'Поверителност'
  },
  en: {
    label:'Property & investment briefing',
    title:'Property and investment briefing for Bulgaria',
    lead:'A short, curated overview for buyers, investors and clients. Subscribe with your email and confirm with one click.',
    t1:'Market picture', t2:'Law and taxes', t3:'Selected properties, price on request',
    emailLabel:'Your email', issueLabel:'Receive the briefing in:',
    consent:'I agree that Bansko Concierge (PEAK CARE EDPK) processes my email address to send me the briefing. Delivery is via Brevo (France). I can withdraw my consent at any time using the link in every email.',
    submit:'Subscribe',
    note:'You will receive a confirmation email. No subscription is made until you confirm.',
    sending:'Sending…',
    ok:'Almost done: we have sent you a confirmation email. Please also check your spam folder.',
    eEmail:'Please enter a valid email address.', eConsent:'Please confirm your consent.', eCaptcha:'Please complete the security check.', eSend:'Sending failed. Please try again or write to hello@banskoconcierge.com.',
    cTitle:'Confirm your subscription', cText:'Press the button to complete your subscription to the Bansko Concierge Briefing.', cBtn:'Confirm', cErr:'This link is invalid or has expired. Please subscribe again.',
    okTitle:'Subscription confirmed', okText:'Thank you. You will receive the next briefing at the address you gave.', privacy:'Privacy'
  },
  de: {
    label:'Immobilien- und Investment-Briefing',
    title:'Immobilien- und Investment-Briefing für Bulgarien',
    lead:'Ein kurzer, kuratierter Überblick für Käufer, Investoren und Klienten. Anmelden und mit einem Klick bestätigen.',
    t1:'Marktbild', t2:'Recht und Steuern', t3:'Ausgewählte Objekte, Preis auf Anfrage',
    emailLabel:'Ihre E-Mail', issueLabel:'Briefing erhalten auf:',
    consent:'Ich willige ein, dass Bansko Concierge (PEAK CARE EDPK) meine E-Mail-Adresse verarbeitet, um mir das Briefing zu senden. Der Versand erfolgt über Brevo (Frankreich). Ich kann meine Einwilligung jederzeit über den Link in jeder E-Mail widerrufen.',
    submit:'Anmelden',
    note:'Sie erhalten eine Bestätigungs-E-Mail. Ohne Ihre Bestätigung erfolgt keine Anmeldung.',
    sending:'Wird gesendet…',
    ok:'Fast geschafft: Wir haben Ihnen eine Bestätigungs-E-Mail geschickt. Bitte prüfen Sie auch den Spam-Ordner.',
    eEmail:'Bitte geben Sie eine gültige E-Mail-Adresse ein.', eConsent:'Bitte bestätigen Sie die Einwilligung.', eCaptcha:'Bitte schließen Sie die Sicherheitsprüfung ab.', eSend:'Senden fehlgeschlagen. Bitte versuchen Sie es erneut oder schreiben Sie an hello@banskoconcierge.com.',
    cTitle:'Anmeldung bestätigen', cText:'Drücken Sie den Button, um die Anmeldung zum Bansko Concierge Briefing abzuschließen.', cBtn:'Bestätigen', cErr:'Dieser Link ist ungültig oder abgelaufen. Bitte melden Sie sich erneut an.',
    okTitle:'Anmeldung bestätigt', okText:'Vielen Dank. Das nächste Briefing erhalten Sie an die angegebene Adresse.', privacy:'Datenschutz'
  }
};
var lang = 'bg';
var qs = new URLSearchParams(location.search);
if (T[qs.get('lang')]) lang = qs.get('lang');
function apply(l){
  lang = l; document.documentElement.lang = l;
  document.querySelectorAll('[data-k]').forEach(function(n){ n.textContent = T[l][n.getAttribute('data-k')]; });
  document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.l===l); });
  var r = document.querySelector('input[name=issue][value=' + (l==='de'?'de':'en') + ']'); if (r) r.checked = true;
}
document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.l); }); });
apply(lang);
if (qs.get('confirmed') === '1') { document.getElementById('confirmed').style.display='block'; document.getElementById('main').style.display='none'; }

var tok = qs.get('c');
if (tok) {
  document.getElementById('main').style.display='none';
  document.getElementById('confirmPanel').style.display='block';
  document.getElementById('cGo').addEventListener('click', function(){
    var b = this, m = document.getElementById('cMsg'); b.disabled = true;
    fetch('/.netlify/functions/briefing', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ action:'confirm', token: tok }) })
    .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
    .then(function(j){
      if (j.ok) { document.getElementById('confirmPanel').style.display='none'; document.getElementById('confirmed').style.display='block'; if (typeof gtag==='function') gtag('event','briefing_signup_confirmed'); }
      else { b.disabled = false; m.className='msg err'; m.textContent = T[lang].cErr; }
    }).catch(function(){ b.disabled = false; m.className='msg err'; m.textContent = T[lang].cErr; });
  });
}
var msg = document.getElementById('msg'), go = document.getElementById('go');
function show(cls, text){ msg.className = 'msg ' + cls; msg.textContent = text; }
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return show('err', T[lang].eEmail);
  if (!document.getElementById('consent').checked) return show('err', T[lang].eConsent);
  var tokEl = document.querySelector('[name="cf-turnstile-response"]'), token = tokEl ? tokEl.value : '';
  if (!token) return show('err', T[lang].eCaptcha);
  go.disabled = true; show('ok', T[lang].sending);
  fetch('/.netlify/functions/briefing', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ email: email, consent: true, token: token, ui: lang,
      issue: document.querySelector('input[name=issue]:checked').value,
      website: document.querySelector('input[name=website]').value }) })
  .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
  .then(function(j){
    if (j.ok) {
      document.getElementById('f').style.display='none';
      document.querySelector('.note').style.display='none';
      var m = document.createElement('div'); m.className='msg ok'; m.setAttribute('role','status'); m.textContent = T[lang].ok;
      document.getElementById('f').insertAdjacentElement('afterend', m);
      if (typeof gtag==='function') gtag('event','briefing_signup_requested');
    } else {
      go.disabled = false;
      show('err', j.error==='captcha' ? T[lang].eCaptcha : j.error==='email' ? T[lang].eEmail : T[lang].eSend);
      if (window.turnstile) { try { turnstile.reset(); } catch (x) {} }
    }
  }).catch(function(){ go.disabled = false; show('err', T[lang].eSend); });
});
</script>
</body>
</html>
